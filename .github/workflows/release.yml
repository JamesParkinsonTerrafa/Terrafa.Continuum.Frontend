name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Two pushes in quick succession must not race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PROJECT: src/Terrafa.Continuum.Frontend/Terrafa.Continuum.Frontend.csproj
  DOTNET_VERSION: "10.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The browser head has no system font stack to fall back on, so a character no
      # embedded font covers ships as a tofu box. Cheap to check, invisible until users see it.
      - name: Check glyph coverage
        run: python3 tools/check-glyphs.py

      - name: Bump patch
        id: next
        run: |
          latest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            version="0.0.1"
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            version="$major.$minor.$((patch + 1))"
          fi
          # Skip over anything already tagged (e.g. a partially failed run).
          while git rev-parse -q --verify "refs/tags/v$version" > /dev/null; do
            IFS=. read -r major minor patch <<< "$version"
            version="$major.$minor.$((patch + 1))"
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing **v$version** (previous: ${latest:-none})" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-x64
          - os: macos-latest
            rid: osx-arm64
          - os: ubuntu-latest
            rid: linux-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      RID: ${{ matrix.rid }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r "$RID" \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:DebugType=none \
            -p:Version="$VERSION" \
            -o publish

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ./packaging/macos/package.sh publish "$VERSION" "$RID" dist

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: ./packaging/linux/package.sh publish "$VERSION" "$RID" dist

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "Terrafa.Continuum-${env:VERSION}-${env:RID}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path publish/* -DestinationPath "dist/$base.zip"

          # Pull in a current Inno Setup; the .iss needs 6.3+ for x64compatible.
          choco upgrade innosetup -y --no-progress
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          & $iscc `
            "/DAppVersion=${env:VERSION}" `
            "/DSourceDir=$($PWD.Path)\publish" `
            "/DOutputDir=$($PWD.Path)\dist" `
            "/DOutputBaseName=$base-setup" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksum assets
        run: |
          # Generated outside dist/ so the file cannot list itself.
          (cd dist && sha256sum -- *) > SHA256SUMS
          mv SHA256SUMS dist/
          cp install.sh install.ps1 dist/
          cat dist/SHA256SUMS

      - name: Compose release notes
        run: |
          cat > notes.md <<'EOF'
          ### Install

          **macOS / Linux**

          1. Open **Terminal** (on a Mac: press ⌘ Space, type `Terminal`, press Return).
          2. Copy the command below, paste it into the Terminal window and press Return:

          ```sh
          curl -fsSL https://raw.githubusercontent.com/__REPO__/main/install.sh | bash
          ```

          3. Wait for the message **Continuum installed**. On a Mac, click
             **Terrafa Continuum** in `/Applications` to run the app.

          **Windows**

          1. Open **PowerShell** (press the Windows key, type `PowerShell`, press Enter).
          2. Copy the command below, paste it into the PowerShell window and press Enter:

          ```powershell
          irm https://raw.githubusercontent.com/__REPO__/main/install.ps1 | iex
          ```

          3. Wait for the message **Continuum installed**. Click
             **Terrafa Continuum** in the Start Menu to run the app.

          The install script verifies each download against its checksum.
          Gatekeeper and SmartScreen do not flag the app, because `curl` and
          `Invoke-WebRequest` do not mark downloads the way a browser does.

          The `.dmg`, `setup.exe` and `.deb` below are unsigned. On macOS,
          right-click the app and select **Open** on first launch. On Windows,
          select **More info** ▸ **Run anyway**.
          EOF
          sed -i "s|__REPO__|$GITHUB_REPOSITORY|g" notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          ls -lh dist
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            dist/*
